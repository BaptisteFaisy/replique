# File de merge Mergify — socle CI self-hosted (R630).
#
# Le depot a une CI reelle (.github/workflows/ci.yml : jobs `ci` et `gardes`)
# : une PR n'entre dans la file que si les deux sont verts, et le garde-fou
# `ci-budget` interdit tout job declare a plus de 5 minutes.
# HERMES_LITE_DRY_RUN reste pose : Mergify est le seul pilote de merge.
# Structure copiée du .mergify.yml de BaptisteFaisy/duello (décision
# user 2026-10-10) : inline labels urgent / priority-low identiques.
queue_rules:
  - name: default
    queue_conditions:
      # Budget CI 5 min (règle user 2026-10-24) : le garde-fou du socle.
      - check-success = ci-budget
      # CI réelle du dépôt (jobs `ci` et `gardes` de .github/workflows/ci.yml).
      - check-success = ci
      - check-success = gardes
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "30 seconds"
    max_checks_retries: 1
    merge_method: rebase
    update_method: rebase

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  # N workers self-hosted (R630, labels replique-worker) ; la speculation
  # Mergify reste bornee a 4, ajustable.
  max_parallel_checks: 4

# Auto-queue natif (produit Merge Queue) : évite de dépendre du produit
# « Workflow Automation » (pull_request_rules), constaté désactivé le 24/10.
merge_protections_settings:
  auto_merge_conditions: true
